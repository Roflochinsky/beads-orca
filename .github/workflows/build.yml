name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beads-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            package-args: --linux --x64
          - os: macos-15
            platform: macos
            package-args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install verified Beads 1.3.2
        run: node scripts/install-ci-bd.mjs
      - run: npm test
      - name: Exercise real isolated Beads database
        run: npm run smoke
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.mjs
      - name: Package desktop applications
        shell: bash
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then unset "$name"; fi
          done
          npm run package:desktop -- ${{ matrix.package-args }}
        env:
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_TEAM_ID || '' }}
      - name: Exercise packaged desktop through real renderer IPC
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo chown root:root release/linux-unpacked/chrome-sandbox
            sudo chmod 4755 release/linux-unpacked/chrome-sandbox
            xvfb-run -a npm run smoke:desktop
          else
            npm run smoke:desktop
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-smoke-${{ matrix.platform }}
          path: artifacts/desktop-*.png
          retention-days: 14
      - name: Package plugins and checksums
        run: npm run package:plugins -- ${{ matrix.platform == 'macos' && '--checksums-only' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: beads-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
            release/*.zip
            release/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: beads-*
          path: downloaded
      - name: Collect verified release artifacts
        run: node scripts/collect-release.mjs
      - name: Publish private repository release
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Beads Board $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
