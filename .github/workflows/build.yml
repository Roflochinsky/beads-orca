name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beads-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            package-args: --linux --x64
          - os: macos-15
            platform: macos
            package-args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install verified Beads 1.3.2
        run: node scripts/install-ci-bd.mjs
      - run: npm test
      - name: Exercise real isolated Beads database
        run: npm run smoke
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.mjs
      - name: Package desktop applications
        run: npm run package:desktop -- ${{ matrix.package-args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_TEAM_ID || '' }}
      - name: Package plugins and checksums
        run: npm run package:plugins -- ${{ matrix.platform == 'macos' && '--checksums-only' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beads-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
            release/*.zip
            release/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: downloaded
      - name: Collect verified release artifacts
        run: node scripts/collect-release.mjs
      - name: Publish private repository release
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Beads Board $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
