name: Build and release Orca plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beads-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install verified Beads 1.3.2
        run: node scripts/install-ci-bd.mjs
      - run: npm test
      - name: Exercise built Orca worker with real isolated Beads database
        run: npm run smoke
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.mjs
      - run: npm run package:plugins
      - name: Verify source and release archive closure
        run: node scripts/check-plugin.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: beads-orca
          if-no-files-found: error
          retention-days: 14
          path: |
            release/beads-orca-*.tar.gz
            release/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: beads-orca
          path: release
      - name: Verify release checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish Orca plugin release
        run: gh release create "$GITHUB_REF_NAME" "release/beads-orca-${GITHUB_REF_NAME#v}.tar.gz" release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Beads Board $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
